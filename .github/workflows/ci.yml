name: Python Računalo CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Prenesi kodo
        uses: actions/checkout@v4
      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zazeni teste
        run: python -m unittest test_racunalo.py